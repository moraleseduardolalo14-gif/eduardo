<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>DARK - Letras 3D</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Letras tridimensionales -->
  <script src="https://unpkg.com/aframe-text-geometry-component@0.5.1/dist/aframe-text-geometry-component.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 12px;
      border-radius: 10px;
      background: #153451;
      color: white;
      font-size: 16px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="aviso">
    Iniciando realidad aumentada...
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind;
                  autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Fuente 3D -->
    <a-assets>
      <a-asset-item
        id="font3d"
        src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/fonts/helvetiker_bold.typeface.json">
      </a-asset-item>
    </a-assets>

    <!-- Camara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Marcador -->
    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0">

      <!-- Iluminacion -->
      <a-entity
        light="type: ambient;
               intensity: 1.3;
               color: #ffffff">
      </a-entity>

      <a-entity
        light="type: directional;
               intensity: 2;
               color: #ffffff"
        position="-1 2 3">
      </a-entity>

      <a-entity
        light="type: point;
               intensity: 1.5;
               color: #66baff;
               distance: 5"
        position="1 1 2">
      </a-entity>

      <!-- Grupo central -->
      <a-entity
        id="grupo-dark"
        position="0 0 0.20"
        animation="property: position;
                   from: 0 0 0.20;
                   to: 0 0 0.27;
                   dir: alternate;
                   dur: 2000;
                   loop: true;
                   easing: easeInOutSine">

        <!-- Texto DARK 3D -->
        <a-entity
          id="texto3d"
          position="-0.62 -0.13 0"
          text-geometry="value: DARK;
                         font: #font3d;
                         size: 0.33;
                         height: 0.12;
                         curveSegments: 10;
                         bevelEnabled: true;
                         bevelThickness: 0.012;
                         bevelSize: 0.008;
                         bevelSegments: 3;"
          material="color: #e6edf7;
                    metalness: 0.6;
                    roughness: 0.3;
                    emissive: #14375a;
                    emissiveIntensity: 0.15;"
          animation="property: rotation;
                     from: 0 -8 0;
                     to: 0 8 0;
                     dir: alternate;
                     dur: 2500;
                     loop: true;
                     easing: easeInOutSine">
        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const marcador = document.querySelector("#marcador");
    const aviso = document.querySelector("#aviso");
    const texto3d = document.querySelector("#texto3d");

    escena.addEventListener("arReady", () => {
      aviso.textContent =
        "Camara lista. Apunta a la imagen DARK";
      aviso.style.background = "#153451";
    });

    escena.addEventListener("arError", () => {
      aviso.textContent =
        "Error al iniciar MindAR";
      aviso.style.background = "#9B2226";
    });

    marcador.addEventListener("targetFound", () => {
      aviso.textContent =
        "Marcador detectado. DARK 3D activado";
      aviso.style.background = "#147D40";
    });

    marcador.addEventListener("targetLost", () => {
      aviso.textContent =
        "Marcador perdido. Vuelve a apuntar";
      aviso.style.background = "#B36B00";
    });

    texto3d.addEventListener("object3dset", () => {
      console.log("Objeto 3D actualizado");
    });
  </script>

</body>
</html>
