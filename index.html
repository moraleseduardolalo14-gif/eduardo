<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>DARK - Realidad Aumentada 3D</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 12px;
      border-radius: 10px;
      background: #153451;
      color: white;
      text-align: center;
      font-size: 16px;
      pointer-events: none;
    }
  </style>

  <script>
    // Letras construidas con geometria 3D real
    AFRAME.registerComponent("dark-3d", {
      init: function () {

        const THREE = AFRAME.THREE;
        const grupo = new THREE.Group();

        const metal = new THREE.MeshStandardMaterial({
          color: 0xbfcde5,
          metalness: 0.55,
          roughness: 0.28,
          emissive: 0x10243e,
          emissiveIntensity: 0.2
        });

        const brillo = new THREE.MeshStandardMaterial({
          color: 0xe9f5ff,
          metalness: 0.25,
          roughness: 0.25
        });

        // Dibuja una barra 3D entre dos puntos
        function barra(x1, y1, x2, y2) {
          const dx = x2 - x1;
          const dy = y2 - y1;
          const largo = Math.sqrt(dx * dx + dy * dy);

          const geometria = new THREE.BoxGeometry(
            0.045, largo + 0.025, 0.095
          );

          const pieza = new THREE.Mesh(geometria, metal);

          pieza.position.set(
            (x1 + x2) / 2,
            (y1 + y2) / 2,
            0
          );

          pieza.rotation.z = -Math.atan2(dx, dy);

          grupo.add(pieza);

          // Reflejo frontal
          const geoBrillo = new THREE.BoxGeometry(
            0.015, largo + 0.008, 0.006
          );

          const reflejo = new THREE.Mesh(
            geoBrillo, brillo
          );

          reflejo.position.set(
            (x1 + x2) / 2 - 0.012,
            (y1 + y2) / 2,
            0.052
          );

          reflejo.rotation.z = pieza.rotation.z;

          grupo.add(reflejo);
        }

        // Letra D
        barra(-0.48, -0.17, -0.48, 0.17);
        barra(-0.48, 0.17, -0.32, 0.17);
        barra(-0.32, 0.17, -0.26, 0.10);
        barra(-0.26, 0.10, -0.26, -0.10);
        barra(-0.26, -0.10, -0.32, -0.17);
        barra(-0.32, -0.17, -0.48, -0.17);

        // Letra A
        barra(-0.19, -0.17, -0.08, 0.17);
        barra(-0.08, 0.17, 0.03, -0.17);
        barra(-0.15, -0.04, -0.01, -0.04);

        // Letra R
        barra(0.10, -0.17, 0.10, 0.17);
        barra(0.10, 0.17, 0.26, 0.17);
        barra(0.26, 0.17, 0.30, 0.12);
        barra(0.30, 0.12, 0.30, 0.035);
        barra(0.30, 0.035, 0.10, 0.035);
        barra(0.19, 0.035, 0.31, -0.17);

        // Letra K
        barra(0.38, -0.17, 0.38, 0.17);
        barra(0.38, 0.00, 0.57, 0.17);
        barra(0.38, 0.00, 0.58, -0.17);

        this.el.object3D.add(grupo);

        console.log("Letras DARK 3D creadas");
      }
    });
  </script>

</head>

<body>

  <div id="aviso">
    Iniciando realidad aumentada...
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind;
                  autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Camara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Imagen que se reconoce -->
    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0">

      <!-- Iluminacion -->
      <a-entity
        light="type: ambient;
               color: #ffffff;
               intensity: 1.8">
      </a-entity>

      <a-entity
        light="type: directional;
               color: #ffffff;
               intensity: 2"
        position="-1 2 3">
      </a-entity>

      <!-- Solo letras DARK en 3D -->
      <a-entity
        id="letras-dark"
        dark-3d
        position="0 0 0.22"
        animation="property: position;
                   from: 0 0 0.22;
                   to: 0 0 0.31;
                   dir: alternate;
                   dur: 1800;
                   loop: true;
                   easing: easeInOutSine">

        <a-animation></a-animation>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const marcador = document.querySelector("#marcador");
    const aviso = document.querySelector("#aviso");

    escena.addEventListener("arReady", () => {
      aviso.textContent =
        "Camara lista. Apunta hacia DARK";
      aviso.style.background = "#153451";
    });

    escena.addEventListener("arError", () => {
      aviso.textContent =
        "Error al iniciar la realidad aumentada";
      aviso.style.background = "#9B2226";
    });

    marcador.addEventListener("targetFound", () => {
      aviso.textContent =
        "DARK 3D activado";
      aviso.style.background = "#147D40";
    });

    marcador.addEventListener("targetLost", () => {
      aviso.textContent =
        "Apunta nuevamente hacia la imagen";
      aviso.style.background = "#153451";
    });
  </script>

</body>
</html>
