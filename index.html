<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto AR - DARK</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 14px;
      border-radius: 10px;
      background: #153451;
      color: white;
      font-size: 18px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="aviso">Iniciando realidad aumentada...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="marcador" mindar-image-target="targetIndex: 0">

      <!-- grupo completo -->
      <a-entity
        id="grupo-dark"
        position="0 0.15 0"
        animation="property: position; to: 0 0.20 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutSine">

        <!-- aro exterior -->
        <a-ring
          color="#168BCD"
          radius-inner="0.70"
          radius-outer="0.80"
          position="0 0.05 0.02"
          rotation="0 0 0"
          material="opacity: 0.85; side: double"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
        </a-ring>

        <!-- panel de fondo -->
        <a-plane
          color="#111111"
          width="2.7"
          height="1.2"
          position="0 0.18 -0.03"
          material="opacity: 0.70; side: double">
        </a-plane>

        <!-- brillo detrás -->
        <a-plane
          color="#1d4e89"
          width="2.9"
          height="1.35"
          position="0 0.18 -0.05"
          material="opacity: 0.22; side: double">
        </a-plane>

        <!-- TEXTO 3D FALSO: capas traseras -->
        <a-text value="DARK" color="#0a0a0a" align="center" width="3.4" position="0 0.32 -0.10"></a-text>
        <a-text value="DARK" color="#111111" align="center" width="3.4" position="0 0.32 -0.08"></a-text>
        <a-text value="DARK" color="#1a1a1a" align="center" width="3.4" position="0 0.32 -0.06"></a-text>
        <a-text value="DARK" color="#222222" align="center" width="3.4" position="0 0.32 -0.04"></a-text>
        <a-text value="DARK" color="#2d2d2d" align="center" width="3.4" position="0 0.32 -0.02"></a-text>

        <!-- capa principal del texto -->
        <a-text
          value="DARK"
          color="#ffffff"
          align="center"
          width="3.4"
          position="0 0.32 0.00"
          animation="property: rotation; to: 0 8 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
        </a-text>

        <!-- sombra suave -->
        <a-text
          value="DARK"
          color="#6ec6ff"
          align="center"
          width="3.45"
          position="0.01 0.31 -0.01"
          material="opacity: 0.35">
        </a-text>

        <!-- subtitulo -->
        <a-text
          value="Misterio y tiempo"
          color="#ffd166"
          align="center"
          width="2.2"
          position="0 -0.12 0.01">
        </a-text>

      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const marcador = document.querySelector("#marcador");
    const aviso = document.querySelector("#aviso");

    escena.addEventListener("arReady", () => {
      aviso.innerHTML = "Camara lista. Apunta hacia target.png";
      aviso.style.background = "#153451";
    });

    escena.addEventListener("arError", () => {
      aviso.innerHTML = "Error al iniciar MindAR. Revisa target.mind";
      aviso.style.background = "#9B2226";
    });

    marcador.addEventListener("targetFound", () => {
      aviso.innerHTML = "Marcador detectado. Texto DARK activado";
      aviso.style.background = "#147D40";
    });

    marcador.addEventListener("targetLost", () => {
      aviso.innerHTML = "Marcador perdido. Vuelve a apuntar";
      aviso.style.background = "#B36B00";
    });
  </script>

</body>
</html>
