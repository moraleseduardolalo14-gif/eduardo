<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DARK AR 3D</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Componente para texto 3D real -->
  <script src="https://unpkg.com/aframe-text-geometry-component/dist/aframe-text-geometry-component.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 14px;
      border-radius: 10px;
      background: #153451;
      color: white;
      font-size: 18px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="aviso">Iniciando realidad aumentada...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="font3d"
        src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/fonts/helvetiker_bold.typeface.json">
      </a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="marcador" mindar-image-target="targetIndex: 0">

      <!-- Grupo principal -->
      <a-entity
        id="grupo-dark"
        position="0 0.1 0"
        rotation="0 0 0"
        animation="property: position; to: 0 0.16 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 1.2; color: #ffffff"></a-entity>
        <a-entity light="type: point; intensity: 1.8; color: #8fd3ff; distance: 8" position="0 1 1"></a-entity>
        <a-entity light="type: point; intensity: 1.2; color: #ffffff; distance: 8" position="0 0.3 1.2"></a-entity>

        <!-- Portal / aro trasero -->
        <a-torus
          position="0 0.15 -0.15"
          radius="0.9"
          radius-tubular="0.05"
          rotation="90 0 0"
          color="#4fc3f7"
          material="emissive: #4fc3f7; emissiveIntensity: 0.7; opacity: 0.85; transparent: true"
          animation="property: rotation; to: 90 360 0; loop: true; dur: 7000; easing: linear">
        </a-torus>

        <!-- Aro interior -->
        <a-torus
          position="0 0.15 -0.14"
          radius="0.68"
          radius-tubular="0.025"
          rotation="90 0 0"
          color="#b3e5fc"
          material="emissive: #b3e5fc; emissiveIntensity: 0.9; opacity: 0.9; transparent: true"
          animation="property: rotation; to: 90 -360 0; loop: true; dur: 5000; easing: linear">
        </a-torus>

        <!-- Fondo suave -->
        <a-plane
          position="0 0.12 -0.25"
          width="2.8"
          height="1.4"
          color="#000000"
          material="opacity: 0.35; transparent: true; side: double">
        </a-plane>

        <!-- Sombra / volumen base -->
        <a-entity
          position="0 0.25 -0.08"
          rotation="0 0 0"
          text-geometry="value: DARK; font: #font3d; size: 0.33; height: 0.12; curveSegments: 8; bevelEnabled: true; bevelSize: 0.01; bevelThickness: 0.01;"
          material="color: #111111; metalness: 0.2; roughness: 0.8">
        </a-entity>

        <!-- Texto 3D principal -->
        <a-entity
          id="texto3d"
          position="0 0.28 0"
          rotation="0 0 0"
          text-geometry="value: DARK; font: #font3d; size: 0.33; height: 0.12; curveSegments: 10; bevelEnabled: true; bevelSize: 0.015; bevelThickness: 0.012;"
          material="color: #f5f5f5; metalness: 0.85; roughness: 0.2; emissive: #1e88e5; emissiveIntensity: 0.18"
          animation="property: rotation; to: 0 10 0; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine">
        </a-entity>

        <!-- Refuerzo de brillo -->
        <a-entity
          position="0 0.28 0.02"
          text-geometry="value: DARK; font: #font3d; size: 0.33; height: 0.04; curveSegments: 8; bevelEnabled: false;"
          material="color: #ffffff; metalness: 0.4; roughness: 0.15; opacity: 0.25; transparent: true">
        </a-entity>

        <!-- Subtitulo -->
        <a-text
          value="Misterio y tiempo"
          color="#ffd166"
          align="center"
          width="2.2"
          position="0 -0.15 0.02"
          side="double">
        </a-text>

      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const marcador = document.querySelector("#marcador");
    const aviso = document.querySelector("#aviso");

    escena.addEventListener("arReady", () => {
      aviso.innerHTML = "Camara lista. Apunta hacia target.png";
      aviso.style.background = "#153451";
    });

    escena.addEventListener("arError", () => {
      aviso.innerHTML = "Error al iniciar MindAR. Revisa target.mind";
      aviso.style.background = "#9B2226";
    });

    marcador.addEventListener("targetFound", () => {
      aviso.innerHTML = "Marcador detectado. DARK 3D activado";
      aviso.style.background = "#147D40";
    });

    marcador.addEventListener("targetLost", () => {
      aviso.innerHTML = "Marcador perdido. Vuelve a apuntar";
      aviso.style.background = "#B36B00";
    });
  </script>

</body>
</html>
