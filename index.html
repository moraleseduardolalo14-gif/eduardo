<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto AR - DARK</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 14px;
      border-radius: 10px;
      background: #153451;
      color: white;
      font-size: 18px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="aviso">Iniciando realidad aumentada...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="marcador" mindar-image-target="targetIndex: 0">

      <!-- Texto principal -->
      <a-text
        value="DARK"
        color="#FFFFFF"
        align="center"
        width="3"
        position="0 0.3 0"
        rotation="0 0 0"
        side="double">
      </a-text>

      <!-- Fondo del texto para que se vea mejor -->
      <a-plane
        color="#111111"
        opacity="0.75"
        width="2.4"
        height="0.8"
        position="0 0.3 -0.01">
      </a-plane>

      <!-- Texto secundario -->
      <a-text
        value="Serie inspirada en un ambiente misterioso"
        color="#FFD700"
        align="center"
        width="2.6"
        position="0 -0.15 0"
        rotation="0 0 0"
        side="double">
      </a-text>

      <!-- Efecto visual extra -->
      <a-ring
        color="#168BCD"
        radius-inner="0.45"
        radius-outer="0.55"
        position="0 0 0.1"
        rotation="90 0 0"
        animation="property: rotation; to: 90 360 0; loop: true; dur: 4000; easing: linear">
      </a-ring>

    </a-entity>
  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const marcador = document.querySelector("#marcador");
    const aviso = document.querySelector("#aviso");

    escena.addEventListener("arReady", () => {
      aviso.innerHTML = "Camara lista. Apunta hacia target.png";
      aviso.style.background = "#153451";
    });

    escena.addEventListener("arError", () => {
      aviso.innerHTML = "Error al iniciar MindAR. Revisa target.mind";
      aviso.style.background = "#9B2226";
    });

    marcador.addEventListener("targetFound", () => {
      aviso.innerHTML = "Marcador detectado. Texto DARK activado";
      aviso.style.background = "#147D40";
    });

    marcador.addEventListener("targetLost", () => {
      aviso.innerHTML = "Marcador perdido. Vuelve a apuntar";
      aviso.style.background = "#B36B00";
    });
  </script>

</body>
</html>
