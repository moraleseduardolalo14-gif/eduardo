
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>DARK - Realidad Aumentada 3D</title>

  <!-- Libreria A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Libreria MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Libreria para letras 3D reales -->
  <script src="https://unpkg.com/aframe-text-geometry-component/dist/aframe-text-geometry-component.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    #aviso {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9999;
      padding: 12px;
      border-radius: 10px;
      background: #153451;
      color: white;
      font-size: 16px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="aviso">
    Iniciando realidad aumentada...
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Fuente para las letras 3D -->
    <a-assets>
      <a-asset-item
        id="font3d"
        src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/fonts/helvetiker_bold.typeface.json">
      </a-asset-item>
    </a-assets>

    <!-- Camara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Imagen que sera reconocida -->
    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0">

      <!-- Iluminacion -->
      <a-entity
        light="type: ambient;
               color: #ffffff;
               intensity: 1.4">
      </a-entity>

      <a-entity
        light="type: directional;
               color: #ffffff;
               intensity: 2"
        position="-1 2 3">
      </a-entity>

      <a-entity
        light="type: point;
               color: #4fc3f7;
               intensity: 1.5;
               distance: 5"
        position="1 0.5 1">
      </a-entity>

      <!-- Grupo principal -->
      <a-entity
        id="grupo-dark"
        position="0 0 0.12"
        animation="property: position;
                   from: 0 0 0.12;
                   to: 0 0 0.18;
                   dir: alternate;
                   dur: 1800;
                   loop: true;
                   easing: easeInOutSine">

        <!-- Letras DARK tridimensionales -->
        <a-entity
          id="texto3d"
          text-geometry="value: DARK;
                         font: #font3d;
                         size: 0.33;
                         height: 0.12;
                         curveSegments: 12;
                         bevelEnabled: true;
                         bevelThickness: 0.012;
                         bevelSize: 0.008;
                         bevelSegments: 3;"
          material="color: #e8edf5;
                    metalness: 0.65;
                    roughness: 0.3;
                    emissive: #12365b;
                    emissiveIntensity: 0.18;"
          animation="property: rotation;
                     from: 0 -8 0;
                     to: 0 8 0;
                     dir: alternate;
                     dur: 2400;
                     loop: true;
                     easing: easeInOutSine">
        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const escena = document.querySelector("a-scene");
    const marcador = document.querySelector("#marcador");
    const aviso = document.querySelector("#aviso");
    const texto = document.querySelector("#texto3d");

    // Centrar las letras 3D sobre el marcador
    texto.addEventListener("loaded", centrarTexto);
    texto.addEventListener(
      "componentchanged",
      function(evento) {
        if (evento.detail.name === "text-geometry") {
          centrarTexto();
        }
      }
    );

    function centrarTexto() {
      const objeto = texto.getObject3D("mesh");

      if (!objeto || !objeto.geometry) {
        return;
      }

      objeto.geometry.computeBoundingBox();

      const caja = objeto.geometry.boundingBox;

      if (caja) {
        const ancho = caja.max.x - caja.min.x;
        const alto = caja.max.y - caja.min.y;

        objeto.position.x =
          -(caja.min.x + ancho / 2);

        objeto.position.y =
          -(caja.min.y + alto / 2);
      }
    }

    // Camara lista
    escena.addEventListener("arReady", () => {
      aviso.textContent =
        "Camara lista. Apunta hacia la imagen DARK";
      aviso.style.background = "#153451";
    });

    // Error de realidad aumentada
    escena.addEventListener("arError", () => {
      aviso.textContent =
        "Error al iniciar MindAR. Revisa target.mind";
      aviso.style.background = "#9B2226";
    });

    // Marcador encontrado
    marcador.addEventListener("targetFound", () => {
      aviso.textContent =
        "DARK 3D activado";
      aviso.style.background = "#147D40";

      setTimeout(() => {
        aviso.style.display = "none";
      }, 1800);
    });

    // Marcador perdido
    marcador.addEventListener("targetLost", () => {
      aviso.style.display = "block";
      aviso.textContent =
        "Apunta nuevamente hacia la imagen DARK";
      aviso.style.background = "#153451";
    });

  </script>

</body>
</html>
